<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - لوحة التحكم | Sweet Accessories</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/dashboard/css/dashboard.css">
</head>
<body class="login-page">
  <div class="login-box">
    <div class="logo-text">Sweet <span>Accessories</span></div>
    <h2>لوحة التحكم</h2>
    <div class="error-msg" id="loginError" style="background:#fef2f2;color:#dc2626;padding:12px;border-radius:var(--radius);margin-bottom:15px;font-size:0.9rem;display:none;"></div>
    <div class="success-msg" id="loginSuccess" style="background:#f0fdf4;color:#16a34a;padding:12px;border-radius:var(--radius);margin-bottom:15px;font-size:0.9rem;display:none;"></div>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" placeholder="admin@sweet-accessories.com" required>
      </div>
      <div class="form-group">
        <label for="password">كلمة المرور</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="login-btn" id="loginBtn">تسجيل الدخول</button>
    </form>
    <button class="register-btn" id="registerBtn">إنشاء حساب الأدمن</button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/dashboard/js/dashboard.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      if (!checkKey()) { window.location.href = '/'; return; }
      checkAuth();

      const errEl = document.getElementById('loginError');
      const successEl = document.getElementById('loginSuccess');

      document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const btn = document.getElementById('loginBtn');

        btn.disabled = true; btn.textContent = 'جاري تسجيل الدخول...';
        errEl.style.display = 'none'; successEl.style.display = 'none';

        try {
          await auth.signInWithEmailAndPassword(email, password);
          window.location.href = '/dashboard/?key=' + DASHBOARD_KEY;
        } catch (error) {
          let msg = 'حدث خطأ في تسجيل الدخول';
          if (error.code === 'auth/user-not-found') msg = 'البريد الإلكتروني غير مسجل';
          else if (error.code === 'auth/wrong-password') msg = 'كلمة المرور غير صحيحة';
          else if (error.code === 'auth/too-many-requests') msg = 'تم تجاوز عدد المحاولات المسموحة';
          errEl.textContent = msg; errEl.style.display = 'block';
          btn.disabled = false; btn.textContent = 'تسجيل الدخول';
        }
      });

      document.getElementById('registerBtn').addEventListener('click', async function() {
        const email = document.getElementById('email').value || 'admin@sweet-accessories.com';
        const password = document.getElementById('password').value || 'admin123';
        this.disabled = true; this.textContent = 'جاري إنشاء الحساب...';
        errEl.style.display = 'none'; successEl.style.display = 'none';

        try {
          await auth.createUserWithEmailAndPassword(email, password);
          successEl.textContent = 'تم إنشاء الحساب! سجل دخول الآن.';
          successEl.style.display = 'block';
          this.textContent = 'تم ✅';
        } catch (error) {
          let msg = 'حدث خطأ';
          if (error.code === 'auth/email-already-in-use') msg = 'الحساب موجود بالفعل';
          else msg = error.message;
          errEl.textContent = msg; errEl.style.display = 'block';
          this.disabled = false; this.textContent = 'إنشاء حساب الأدمن';
        }
      });
    });
  </script>
</body>
</html>
