<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - Sweet Accessories</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body style="margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);font-family:'Cairo',sans-serif;direction:rtl;">

<div style="background:white;border-radius:24px;padding:40px 30px;width:92%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,0.3);text-align:center;">
  <div style="font-size:1.8rem;font-weight:800;color:#8B0D32;margin-bottom:3px;">Sweet <span style="color:#EBA9BF;">Accessories</span></div>
  <p style="font-size:1rem;color:#6b7280;margin:0 0 25px;">لوحة التحكم</p>

  <div id="errorMsg" style="display:none;background:#fef2f2;color:#dc2626;padding:12px;border-radius:12px;margin-bottom:15px;font-size:0.9rem;"></div>

  <form id="loginForm">
    <div style="text-align:right;margin-bottom:15px;">
      <label style="display:block;font-weight:600;margin-bottom:5px;font-size:0.9rem;">البريد الإلكتروني</label>
      <input type="email" id="email" value="admin@sweet-accessories.com" style="width:100%;padding:12px;border:2px solid #e5e7eb;border-radius:12px;font-size:0.95rem;font-family:'Cairo',sans-serif;background:#f9fafb;box-sizing:border-box;">
    </div>
    <div style="text-align:right;margin-bottom:15px;">
      <label style="display:block;font-weight:600;margin-bottom:5px;font-size:0.9rem;">كلمة المرور</label>
      <input type="password" id="password" value="admin123" style="width:100%;padding:12px;border:2px solid #e5e7eb;border-radius:12px;font-size:0.95rem;font-family:'Cairo',sans-serif;background:#f9fafb;box-sizing:border-box;">
    </div>
    <button type="submit" id="loginBtn" style="width:100%;padding:13px;background:linear-gradient(135deg,#8B0D32,#a0103e);color:white;border:none;border-radius:12px;font-size:1rem;font-family:'Cairo',sans-serif;font-weight:700;cursor:pointer;">تسجيل الدخول</button>
  </form>
</div>

<script>
// Simple local login - no Firebase dependency
var ADMIN_EMAIL = 'admin@sweet-accessories.com';
var ADMIN_PASSWORD = 'admin123';

document.getElementById('loginForm').addEventListener('submit', function(e) {
  e.preventDefault();
  var email = document.getElementById('email').value;
  var password = document.getElementById('password').value;
  var btn = document.getElementById('loginBtn');
  var errEl = document.getElementById('errorMsg');

  if (email === ADMIN_EMAIL && password === ADMIN_PASSWORD) {
    btn.disabled = true;
    btn.textContent = 'جاري تسجيل الدخول...';
    localStorage.setItem('sweet_admin_local', 'true');
    localStorage.setItem('sweet_admin_email', email);
    window.location.href = '/dashboard/';
  } else {
    errEl.textContent = 'البريد الإلكتروني أو كلمة المرور غير صحيحة';
    errEl.style.display = 'block';
  }
});
</script>
</body>
</html>
