<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - Sweet Accessories</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/dashboard/css/dashboard.css">
  <style>
    html, body { margin:0; height:100%; }
    body {
      font-family: 'Cairo', sans-serif;
      direction: rtl;
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .box {
      background: rgba(255,255,255,0.96);
      border-radius: 24px;
      padding: 45px 35px;
      width: 92%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
    }
    .box h1 { font-size:1.8rem; font-weight:800; color:#8B0D32; margin:0 0 5px; }
    .box h1 span { color:#EBA9BF; }
    .box h2 { font-size:1.1rem; color:#6b7280; margin:0 0 25px; font-weight:500; }
    .box input {
      width: 100%;
      padding: 13px 14px;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      font-size: 0.95rem;
      font-family: 'Cairo', sans-serif;
      background: #f9fafb;
      box-sizing: border-box;
      transition: border-color 0.3s;
    }
    .box input:focus { border-color: #8B0D32; outline: none; background: white; }
    .box label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; text-align: right; }
    .box .field { margin-bottom: 18px; text-align: right; }
    .box .btn-primary {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, #8B0D32, #a0103e);
      color: white; border: none; border-radius: 12px;
      font-size: 1rem; font-family: 'Cairo', sans-serif;
      font-weight: 700; cursor: pointer;
    }
    .box .btn-primary:disabled { opacity: 0.6; }
    .box .btn-secondary {
      width: 100%; padding: 12px;
      background: transparent; color: #8B0D32;
      border: 2px solid #8B0D32; border-radius: 12px;
      font-size: 0.9rem; font-family: 'Cairo', sans-serif;
      font-weight: 600; cursor: pointer; margin-top: 10px;
    }
    .box .msg { display: none; padding: 12px; border-radius: 12px; margin-bottom: 15px; font-size: 0.9rem; }
    .box .msg.error { display: block; background: #fef2f2; color: #dc2626; }
    .box .msg.success { display: block; background: #f0fdf4; color: #16a34a; }
    .box .msg.info { display: block; background: #eff6ff; color: #2563eb; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Sweet <span>Accessories</span></h1>
    <h2>لوحة التحكم</h2>
    <div class="msg info" id="loadingMsg">جاري تحميل النظام...</div>
    <div class="msg error" id="errorMsg"></div>
    <div class="msg success" id="successMsg"></div>
    <form id="loginForm" style="display:none;">
      <div class="field">
        <label>البريد الإلكتروني</label>
        <input type="email" id="email" value="admin@sweet-accessories.com">
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <input type="password" id="password" value="admin123">
      </div>
      <button type="submit" class="btn-primary" id="loginBtn">تسجيل الدخول</button>
    </form>
    <button class="btn-secondary" id="registerBtn" style="display:none;">إنشاء حساب الأدمن</button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/dashboard/js/dashboard.js"></script>
  <script>
    // All scripts loaded synchronously - no race conditions
    (function() {
      var loadingMsg = document.getElementById('loadingMsg');
      var errorMsg = document.getElementById('errorMsg');
      var successMsg = document.getElementById('successMsg');
      var loginForm = document.getElementById('loginForm');
      var registerBtn = document.getElementById('registerBtn');

      if (!checkKey()) { window.location.href = '/'; return; }
      checkAuth();

      loadingMsg.style.display = 'none';
      loginForm.style.display = 'block';
      registerBtn.style.display = 'block';

      document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var email = document.getElementById('email').value;
        var password = document.getElementById('password').value;
        var btn = document.getElementById('loginBtn');
        btn.disabled = true; btn.textContent = 'جاري تسجيل الدخول...';
        errorMsg.className = 'msg'; successMsg.className = 'msg';

        auth.signInWithEmailAndPassword(email, password)
          .then(function() {
            window.location.href = '/dashboard/?key=' + DASHBOARD_KEY;
          })
          .catch(function(error) {
            var msg = 'حدث خطأ';
            if (error.code === 'auth/user-not-found') msg = 'البريد الإلكتروني غير مسجل - استخدم "إنشاء حساب" أولاً';
            else if (error.code === 'auth/wrong-password') msg = 'كلمة المرور غير صحيحة';
            else if (error.code === 'auth/too-many-requests') msg = 'تم تجاوز عدد المحاولات المسموحة';
            else msg = error.message;
            errorMsg.textContent = msg; errorMsg.className = 'msg error';
            btn.disabled = false; btn.textContent = 'تسجيل الدخول';
          });
      });

      registerBtn.addEventListener('click', function() {
        var email = document.getElementById('email').value || 'admin@sweet-accessories.com';
        var password = document.getElementById('password').value || 'admin123';
        this.disabled = true; this.textContent = 'جاري...';
        errorMsg.className = 'msg'; successMsg.className = 'msg';

        auth.createUserWithEmailAndPassword(email, password)
          .then(function() {
            successMsg.textContent = 'تم إنشاء الحساب! سجل دخول الآن.';
            successMsg.className = 'msg success';
            registerBtn.textContent = 'تم ✅';
          })
          .catch(function(error) {
            var msg = 'حدث خطأ';
            if (error.code === 'auth/email-already-in-use') msg = 'الحساب موجود بالفعل - سجل دخول';
            else if (error.code === 'auth/weak-password') msg = 'كلمة المرور ضعيفة (6 أحرف فأكثر)';
            else msg = error.message;
            errorMsg.textContent = msg; errorMsg.className = 'msg error';
            registerBtn.disabled = false;
            registerBtn.textContent = 'إنشاء حساب الأدمن';
          });
      });
    })();
  </script>
</body>
</html>
