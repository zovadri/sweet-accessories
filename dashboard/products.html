<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة المنتجات | Sweet Accessories</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/dashboard/css/dashboard.css">
</head>
<body>
  <div class="dashboard-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">Sweet <span>Accessories</span></div>
      </div>
      <nav class="sidebar-nav">
        <a href="/dashboard/"><i class="fas fa-home"></i> الرئيسية</a>
        <a href="/dashboard/products.html" class="active"><i class="fas fa-box"></i> المنتجات</a>
        <a href="/dashboard/orders.html"><i class="fas fa-shopping-bag"></i> الطلبات</a>
        <a href="/dashboard/categories.html"><i class="fas fa-tags"></i> الأقسام</a>
        <a href="/dashboard/banners.html"><i class="fas fa-images"></i> البنرات</a>
        <a href="/dashboard/reviews.html"><i class="fas fa-star"></i> التقييمات</a>
        <a href="/dashboard/settings.html"><i class="fas fa-cog"></i> الإعدادات</a>
        <a href="#" onclick="handleLogout()" class="logout-link"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="topbar-title">
          <h1>المنتجات</h1>
          <p>إدارة منتجات المتجر</p>
        </div>
        <div class="topbar-actions">
          <button class="btn btn-primary" onclick="openProductModal()"><i class="fas fa-plus"></i> إضافة منتج</button>
        </div>
      </header>

      <div class="content-body">
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>الصورة</th>
                <th>الاسم</th>
                <th>السعر</th>
                <th>القسم</th>
                <th>المخزون</th>
                <th>الحالة</th>
                <th>الإجراءات</th>
              </tr>
            </thead>
            <tbody id="productsTable">
              <tr><td colspan="7" style="text-align:center;color:#999;">جاري التحميل...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="productModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">إضافة منتج جديد</h3>
        <span class="modal-close" onclick="closeProductModal()">&times;</span>
      </div>
      <form id="productForm" onsubmit="saveProduct(event)">
        <input type="hidden" id="productId">
        <div class="form-group">
          <label>اسم المنتج</label>
          <input type="text" id="prodName" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>السعر بعد الخصم (جنيه)</label>
            <input type="number" id="prodPrice" step="0.01" required>
          </div>
          <div class="form-group">
            <label>السعر قبل الخصم (جنيه)</label>
            <input type="number" id="prodOldPrice" step="0.01" placeholder="اتركه فارغاً إن لم يكن هناك خصم">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>نسبة الخصم (%)</label>
            <input type="number" id="prodDiscount" step="1" min="0" max="100" placeholder="تلقائي أو يدوي">
          </div>
          <div class="form-group">
            <label>القسم</label>
            <select id="prodCategory" required></select>
          </div>
        </div>
        <div class="form-group">
          <label>وصف المنتج</label>
          <div style="display:flex;gap:8px">
            <textarea id="prodDesc" rows="3" style="flex:1"></textarea>
            <button type="button" onclick="generateAIDesc()" style="white-space:nowrap;padding:8px 12px;background:#8B0D32;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;align-self:flex-start">🪄 AI وصف</button>
          </div>
        </div>
        <div class="form-group">
          <label>صور المنتج <small style="color:#999;font-weight:400;">(يمكنك اختيار أكثر من صورة)</small></label>
          <input type="file" id="prodImage" accept="image/*" multiple>
          <div id="prodImagePreview" style="margin-top:0.5rem;display:flex;gap:8px;flex-wrap:wrap;"></div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>الألوان المتاحة <small style="color:#999;font-weight:400;">(افصل بـ ,)</small></label>
            <input type="text" id="prodColors" placeholder="ذهبي, فضي, أسود">
          </div>
          <div class="form-group">
            <label>المقاسات المتاحة <small style="color:#999;font-weight:400;">(افصل بـ ,)</small></label>
            <input type="text" id="prodSizes" placeholder="صغير, متوسط, كبير">
          </div>
          <div class="form-group">
            <label>الكمية المتاحة</label>
            <input type="number" id="prodStock" min="0" value="0" placeholder="0 = غير متوفر">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label><input type="checkbox" id="prodActive" checked> منتج نشط</label>
          </div>
          <div class="form-group">
            <label><input type="checkbox" id="prodFeatured"> منتج مميز</label>
          </div>
          <div class="form-group">
            <label><input type="checkbox" id="prodBestseller"> الأكثر مبيعًا</label>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" id="saveProductBtn">حفظ</button>
      </form>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="/js/firebase-config.min.js"></script>
  <script src="/js/cloudinary.min.js"></script>
  <script src="/dashboard/js/dashboard.js"></script>
  <script>
    let editId = null;
    let categoriesMap = {};

    document.addEventListener('DOMContentLoaded', function() {
      checkAuth();
      loadCategoriesDropdown();
      loadProducts();
      document.getElementById('prodImage').addEventListener('change', function() {
        const preview = document.getElementById('prodImagePreview');
        preview.innerHTML = '';
        for (const file of this.files) {
          const reader = new FileReader();
          reader.onload = e => {
            preview.innerHTML += `<img src="${e.target.result}" style="width:80px;height:80px;border-radius:8px;object-fit:cover;border:2px solid #eee;">`;
          };
          reader.readAsDataURL(file);
        }
      });
    });

    function loadCategoriesDropdown() {
      try { db.collection('categories').onSnapshot(snap => {
        const sel = document.getElementById('prodCategory');
        sel.innerHTML = '<option value="">اختر القسم</option>';
        categoriesMap = {};
        snap.forEach(d => {
          const c = d.data();
          categoriesMap[d.id] = c.name;
          sel.innerHTML += `<option value="${d.id}">${c.name}</option>`;
        });
      }); } catch(e) {}
    }

    function loadProducts() {
      try { db.collection('products').orderBy('createdAt', 'desc').onSnapshot(snap => {
        const tbody = document.getElementById('productsTable');
        if (snap.empty) {
          tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:#999;">لا توجد منتجات</td></tr>';
          return;
        }
        tbody.innerHTML = snap.docs.map(d => {
          const p = d.data(); const id = d.id;
          const img = p.images && p.images.length ? p.images[0] : (p.image || 'https://via.placeholder.com/50');
          const priceDisplay = p.oldPrice ? `<span style="text-decoration:line-through;color:#999;font-size:0.8rem">${p.oldPrice}</span> ${p.price}` : `${p.price}`;
          const stock = p.stock !== undefined ? p.stock : -1;
          const stockLabel = stock === 0 ? '<span style="color:#b91c1c;font-weight:600;">غير متوفر</span>' : stock > 0 ? `<span style="color:#047857;font-weight:600;">${stock}</span>` : '<span style="color:#999;">-</span>';
          return `<tr>
            <td><img src="${img}" alt="${p.name}" class="table-thumb"></td>
            <td>${p.name}</td>
            <td>${priceDisplay} جنيه</td>
            <td>${p.categoryName || '-'}</td>
            <td>${stockLabel}</td>
            <td><span class="badge ${p.active !== false ? 'badge-active' : 'badge-inactive'}">${p.active !== false ? 'نشط' : 'غير نشط'}</span></td>
            <td class="actions-cell">
              <button class="btn-action btn-edit" onclick="editProduct('${id}')" title="تعديل"><i class="fas fa-edit"></i></button>
              <button class="btn-action btn-delete" onclick="deleteProduct('${id}')" title="حذف"><i class="fas fa-trash"></i></button>
            </td>
          </tr>`;
        }).join('');
      }); } catch(e) {}
    }

    function openProductModal(data) {
      document.getElementById('productModal').style.display = 'flex';
      if (data) {
        document.getElementById('modalTitle').textContent = 'تعديل المنتج';
        document.getElementById('productId').value = data.id;
        document.getElementById('prodName').value = data.name || '';
        document.getElementById('prodPrice').value = data.price || '';
        document.getElementById('prodOldPrice').value = data.oldPrice || '';
        document.getElementById('prodDiscount').value = data.discount || '';
        document.getElementById('prodCategory').value = data.category || '';
        document.getElementById('prodDesc').value = data.desc || '';
        document.getElementById('prodActive').checked = data.active !== false;
        document.getElementById('prodFeatured').checked = data.featured === true;
        document.getElementById('prodBestseller').checked = data.bestseller === true;
        document.getElementById('prodColors').value = (data.colors && Array.isArray(data.colors)) ? data.colors.map(c => typeof c === 'string' ? c : c.name).join(', ') : '';
        document.getElementById('prodSizes').value = (data.sizes && Array.isArray(data.sizes)) ? data.sizes.join(', ') : '';
        document.getElementById('prodStock').value = data.stock !== undefined ? data.stock : 0;
        const preview = document.getElementById('prodImagePreview');
        preview.innerHTML = '';
        if (data.images && data.images.length) {
          data.images.forEach(url => {
            preview.innerHTML += `<img src="${url}" style="width:80px;height:80px;border-radius:8px;object-fit:cover;border:2px solid #eee;">`;
          });
        } else if (data.image) {
          preview.innerHTML = `<img src="${data.image}" style="width:80px;height:80px;border-radius:8px;object-fit:cover;">`;
        }
      } else {
        document.getElementById('modalTitle').textContent = 'إضافة منتج جديد';
        document.getElementById('productForm').reset();
        document.getElementById('productId').value = '';
        document.getElementById('prodImagePreview').innerHTML = '';
      }
    }

    function closeProductModal() {
      document.getElementById('productModal').style.display = 'none';
    }

    function editProduct(id) {
      db.collection('products').doc(id).get().then(doc => {
        if (doc.exists) openProductModal({ id: doc.id, ...doc.data() });
      });
    }

    function deleteProduct(id) {
      if (confirm('هل أنت متأكد من حذف هذا المنتج؟')) {
        db.collection('products').doc(id).delete();
      }
    }

    async function saveProduct(e) {
      e.preventDefault();
      const btn = document.getElementById('saveProductBtn');
      btn.disabled = true; btn.textContent = 'جاري الحفظ...';
      try {
        const id = document.getElementById('productId').value;
        const name = document.getElementById('prodName').value;
        const price = parseFloat(document.getElementById('prodPrice').value) || 0;
        const oldPrice = parseFloat(document.getElementById('prodOldPrice').value) || 0;
        let discount = parseInt(document.getElementById('prodDiscount').value) || 0;
        const category = document.getElementById('prodCategory').value;
        const categoryName = categoriesMap[category] || '';
        const desc = document.getElementById('prodDesc').value;
        const active = document.getElementById('prodActive').checked;
        const featured = document.getElementById('prodFeatured').checked;
        const bestseller = document.getElementById('prodBestseller').checked;
        const colorsRaw = document.getElementById('prodColors').value;
        const sizesRaw = document.getElementById('prodSizes').value;
        const stock = parseInt(document.getElementById('prodStock').value) || 0;

        if (!discount && oldPrice > price) {
          discount = Math.round((1 - price / oldPrice) * 100);
        }

        const data = { name, price, oldPrice, discount, category, categoryName, desc, active, featured, bestseller, stock, colors: colorsRaw ? colorsRaw.split(',').map(s => s.trim()).filter(Boolean) : [], sizes: sizesRaw ? sizesRaw.split(',').map(s => s.trim()).filter(Boolean) : [], updatedAt: firebase.firestore.FieldValue.serverTimestamp() };

        const files = document.getElementById('prodImage').files;
        if (files.length > 0) {
          const urls = [];
          for (let i = 0; i < files.length; i++) {
            const url = await uploadImage(files[i]);
            if (url) urls.push(url);
          }
          if (urls.length > 0) {
            data.images = urls;
            data.image = urls[0];
          }
        }

        if (id) {
          await db.collection('products').doc(id).update(data);
        } else {
          data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
          await db.collection('products').add(data);
        }
        closeProductModal();
      } catch(err) { alert('خطأ: ' + err.message); }
      btn.disabled = false; btn.textContent = 'حفظ';
    }

    function analyzeImage(img) {
      const c = document.createElement('canvas');
      const ctx = c.getContext('2d');
      c.width = 100; c.height = 100;
      ctx.drawImage(img, 0, 0, 100, 100);
      const d = ctx.getImageData(0, 0, 100, 100).data;
      let r = 0, g = 0, b = 0, bright = 0, colorful = 0, n = 0;
      const colors = {};
      for (let i = 0; i < d.length; i += 16) {
        const rv = d[i], gv = d[i+1], bv = d[i+2];
        r += rv; g += gv; b += bv;
        bright += (rv + gv + bv) / 3;
        colorful += Math.abs(rv - gv) + Math.abs(gv - bv) + Math.abs(bv - rv);
        const key = `${Math.round(rv/50)},${Math.round(gv/50)},${Math.round(bv/50)}`;
        colors[key] = (colors[key] || 0) + 1;
        n++;
      }
      r /= n; g /= n; b /= n;
      bright /= n; colorful /= n;
      const top = Object.entries(colors).sort((a, b) => b[1] - a[1]).slice(0, 3);
      const names = top.map(([k]) => {
        const [rr, gg, bb] = k.split(',').map(Number);
        const v = (rr*50 + gg*50 + bb*50);
        if (v < 80) return 'داكن';
        if (v > 200) return 'فاتح';
        if (Math.abs(rr*50 - gg*50) + Math.abs(gg*50 - bb*50) < 30) return 'نيوترال';
        if (rr*50 > gg*50 && rr*50 > bb*50) return 'أحمر/ذهبي';
        if (gg*50 > rr*50 && gg*50 > bb*50) return 'أخضر';
        if (bb*50 > rr*50 && bb*50 > gg*50) return 'أزرق';
        if (rr*50 > 120 && gg*50 < 100) return 'وردي/بنفسجي';
        if (gg*50 > 120 && rr*50 < 100) return 'فاتح';
        return 'مميز';
      }).filter((v, i, a) => a.indexOf(v) === i).join(' و ');
      return { bright, colorful, avgColor: `rgb(${r},${g},${b})`, names };
    }

    async function generateAIDesc() {
      const btn = document.querySelector('button[onclick="generateAIDesc()"]');
      const name = document.getElementById('prodName').value.trim();
      if (!name) { alert('أدخل اسم المنتج أولاً'); return; }
      btn.disabled = true; btn.textContent = '🪄 جاري التوليد...';

      const colors = document.getElementById('prodColors').value.trim();
      const sizes = document.getElementById('prodSizes').value.trim();
      const files = document.getElementById('prodImage').files;
      const extra = [];
      if (colors) extra.push(`بألوان ${colors}`);
      if (sizes) extra.push(`مقاسات ${sizes}`);

      let imgInfo = '';
      if (files.length > 0) {
        try {
          const img = await new Promise((r, rej) => {
            const i = new Image();
            i.onload = () => r(i);
            i.onerror = rej;
            i.src = URL.createObjectURL(files[0]);
          });
          const info = analyzeImage(img);
          URL.revokeObjectURL(img.src);
          if (info.names) {
            const tone = info.bright < 100 ? 'داكنة و' : info.bright > 170 ? 'مشرقة و' : 'متناسقة و';
            const colorfulness = info.colorful > 50 ? 'ألوانها زاهية' : 'ألوانها ناعمة';
            if (info.names !== 'مميز') {
              extra.push(` لون ${info.names}`);
              imgInfo = `${tone}${colorfulness}`;
            }
          }
        } catch(e) {}
      }

      const adj = ['أنيق', 'عصري', 'رائع', 'فاخر', 'ناعم', 'شيك', 'مميز', 'جذاب', 'حلو', 'جميل', 'ملكي', 'كلاسيكي', 'مودرن', 'رقيق', 'مبهر', 'ساحر'];
      const vibe = ['بإطلالتك', 'في كل مناسبة', 'في يومك', 'في طلتك', 'في حياتك', 'في ستايلك', 'في لوكك'];
      const feat = ['خامات فاخرة', 'تصميم عصري', 'جودة عالية', 'تفاصيل دقيقة', 'شكل أنيق', 'لون جذاب', 'خامة ممتازة', 'دقة في الصنع'];
      const action = ['هتحبيه أوي', 'مش هتستغني عنه', 'هيبقى أحلى إضافة', 'يستاهل يكون عندك', 'هيميزك', 'هيضيف لمسة جمال', 'هيكون قطعة أساسية'];

      const a1 = adj[Math.floor(Math.random() * adj.length)];
      const a2 = adj[Math.floor(Math.random() * adj.length)];
      const v = vibe[Math.floor(Math.random() * vibe.length)];
      const f = feat[Math.floor(Math.random() * feat.length)];
      const ac = action[Math.floor(Math.random() * action.length)];

      let patterns;
      if (imgInfo) {
        patterns = [
          `${name} — ${imgInfo}، ${a1} و${a2} ${ac}`,
          `${name} — ${a1} و${a2}، ${f} ${v}`,
          `${name} — ${imgInfo} ${ac} ${v}`,
        ];
      } else {
        patterns = [
          `${name} — ${a1} و${a2}، ${f} ${ac}`,
          `${name} — ${a1} و${a2}، ${ac} ${v}`,
          `${name} — ${f}، ${a1} ${ac}`,
          `${name} — ${a1}، ${ac} ${v}`,
          `${name} — ${a1} و${a2}، ${f} و${ac}`,
        ];
      }
      let desc = patterns[Math.floor(Math.random() * patterns.length)];
      if (extra.length) desc += ` (${extra.join('، ')})`;

      document.getElementById('prodDesc').value = desc;
      btn.disabled = false; btn.textContent = '🪄 AI وصف';
    }
  </script>
</body>
</html>
