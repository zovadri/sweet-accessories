<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة التقييمات | Sweet Accessories</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/dashboard/css/dashboard.css">
  <style>
    .star-rating-input { direction: ltr; display: inline-flex; gap: 4px; }
    .star-rating-input i { font-size: 1.8rem; cursor: pointer; color: #ddd; transition: all .2s; }
    .star-rating-input i.active, .star-rating-input i:hover, .star-rating-input i:hover ~ i { color: #f59e0b; }
    .preview-imgs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .preview-imgs img { width: 70px; height: 70px; border-radius: 8px; object-fit: cover; border: 2px solid var(--border); }
    .review-thumb { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; }
  </style>
</head>
<body>
  <div class="dashboard-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">Sweet <span>Accessories</span></div>
      </div>
      <nav class="sidebar-nav">
        <a href="/dashboard/"><i class="fas fa-home"></i> الرئيسية</a>
        <a href="/dashboard/products.html"><i class="fas fa-box"></i> المنتجات</a>
        <a href="/dashboard/orders.html"><i class="fas fa-shopping-bag"></i> الطلبات</a>
        <a href="/dashboard/coupons.html"><i class="fas fa-tag"></i> كوبونات</a>
        <a href="/dashboard/categories.html"><i class="fas fa-tags"></i> الأقسام</a>
        <a href="/dashboard/banners.html"><i class="fas fa-images"></i> البنرات</a>
        <a href="/dashboard/reviews.html" class="active"><i class="fas fa-star"></i> التقييمات</a>
        <a href="/dashboard/settings.html"><i class="fas fa-cog"></i> الإعدادات</a>
        <a href="#" onclick="handleLogout()" class="logout-link"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="topbar-title">
          <h1>التقييمات</h1>
          <p>إدارة تقييمات العملاء</p>
        </div>
        <div class="topbar-actions">
          <button class="btn btn-primary" onclick="openReviewModal()"><i class="fas fa-plus"></i> إضافة تقييم</button>
        </div>
      </header>

      <div class="content-body">
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>الصورة</th>
                <th>العميل</th>
                <th>التقييم</th>
                <th>التعليق</th>
                <th>الحالة</th>
                <th>الإجراءات</th>
              </tr>
            </thead>
            <tbody id="reviewsTable">
              <tr><td colspan="6" style="text-align:center;color:#999;">جاري التحميل...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="reviewModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="reviewModalTitle">إضافة تقييم جديد</h3>
        <span class="modal-close" onclick="closeReviewModal()">&times;</span>
      </div>
      <form id="reviewForm" onsubmit="saveReview(event)">
        <input type="hidden" id="reviewId">
        <div class="form-row">
          <div class="form-group">
            <label>اسم العميل</label>
            <input type="text" id="revName" required>
          </div>
          <div class="form-group">
            <label>البريد الإلكتروني (اختياري)</label>
            <input type="email" id="revEmail">
          </div>
        </div>
        <div class="form-group">
          <label>التقييم</label>
          <div class="star-rating-input" id="starRating">
            <i class="fas fa-star" data-value="5"></i>
            <i class="fas fa-star" data-value="4"></i>
            <i class="fas fa-star" data-value="3"></i>
            <i class="fas fa-star" data-value="2"></i>
            <i class="fas fa-star" data-value="1"></i>
          </div>
        </div>
        <div class="form-group">
          <label>التعليق</label>
          <textarea id="revComment" rows="3" required></textarea>
        </div>
        <div class="form-group">
          <label>صور التقييم <small style="color:#999;font-weight:400;">(يمكنك اختيار أكثر من صورة)</small></label>
          <input type="file" id="revImages" accept="image/*" multiple>
          <div class="preview-imgs" id="revImagePreview"></div>
        </div>
        <div class="form-group">
          <label><input type="checkbox" id="revApproved" checked> مقبول</label>
        </div>
        <button type="submit" class="btn btn-primary" id="saveRevBtn">حفظ</button>
      </form>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/cloudinary.js"></script>
  <script src="/dashboard/js/dashboard.js"></script>
  <script>
    let reviewRating = 5;

    document.addEventListener('DOMContentLoaded', function() {
      checkAuth();
      loadReviews();
      setupStarRating();
      document.getElementById('revImages').addEventListener('change', function() {
        const preview = document.getElementById('revImagePreview');
        preview.innerHTML = '';
        for (const file of this.files) {
          const reader = new FileReader();
          reader.onload = e => {
            preview.innerHTML += `<img src="${e.target.result}">`;
          };
          reader.readAsDataURL(file);
        }
      });
    });

    function setupStarRating() {
      const stars = document.querySelectorAll('#starRating i');
      stars.forEach(s => {
        s.addEventListener('click', function() {
          reviewRating = parseInt(this.dataset.value);
          stars.forEach(st => st.classList.toggle('active', parseInt(st.dataset.value) >= reviewRating));
          // Re-apply in reverse order using CSS
          stars.forEach(st => st.style.color = parseInt(st.dataset.value) >= reviewRating ? '#f59e0b' : '#ddd');
        });
        // Set initial
        s.style.color = parseInt(s.dataset.value) >= 5 ? '#f59e0b' : '#ddd';
      });
    }

    function loadReviews() {
      db.collection('reviews').orderBy('createdAt', 'desc').onSnapshot(snap => {
        const tbody = document.getElementById('reviewsTable');
        if (snap.empty) {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#999;">لا توجد تقييمات</td></tr>';
          return;
        }
        tbody.innerHTML = snap.docs.map(d => {
          const r = d.data(); const id = d.id;
          const img = r.images?.[0] || r.image || '';
          const stars = Array(5).fill('').map((_, i) => `<i class="fas fa-star" style="color:${i < r.rating ? '#f59e0b' : '#ddd'};"></i>`).join('');
          const imgHtml = img ? `<img src="${img}" class="review-thumb">` : '<span style="color:#ccc">-</span>';
          return `<tr>
            <td>${imgHtml}</td>
            <td><strong>${r.name || 'زائر'}</strong>${r.email ? `<br><small style="color:#999;">${r.email}</small>` : ''}</td>
            <td>${stars}</td>
            <td style="max-width:250px;">${r.comment || '-'}</td>
            <td><span class="badge ${r.approved ? 'badge-active' : 'badge-inactive'}" id="status_${id}">${r.approved ? 'مقبول' : 'معلق'}</span></td>
            <td class="actions-cell">
              <button class="btn-action btn-edit" onclick="editReview('${id}')" title="تعديل"><i class="fas fa-edit"></i></button>
              <button class="btn-action ${r.approved ? 'btn-warning' : 'btn-success'}" onclick="toggleReview('${id}', ${!r.approved})" title="${r.approved ? 'إلغاء الموافقة' : 'موافقة'}"><i class="fas ${r.approved ? 'fa-times' : 'fa-check'}"></i></button>
              <button class="btn-action btn-delete" onclick="deleteReview('${id}')" title="حذف"><i class="fas fa-trash"></i></button>
            </td>
          </tr>`;
        }).join('');
      });
    }

    function openReviewModal(data) {
      document.getElementById('reviewModal').style.display = 'flex';
      if (data) {
        document.getElementById('reviewModalTitle').textContent = 'تعديل التقييم';
        document.getElementById('reviewId').value = data.id;
        document.getElementById('revName').value = data.name || '';
        document.getElementById('revEmail').value = data.email || '';
        document.getElementById('revComment').value = data.comment || '';
        document.getElementById('revApproved').checked = data.approved !== false;
        reviewRating = data.rating || 5;
        const stars = document.querySelectorAll('#starRating i');
        stars.forEach(s => s.style.color = parseInt(s.dataset.value) >= reviewRating ? '#f59e0b' : '#ddd');
        const preview = document.getElementById('revImagePreview');
        preview.innerHTML = '';
        if (data.images && data.images.length) {
          data.images.forEach(url => { preview.innerHTML += `<img src="${url}">`; });
        } else if (data.image) {
          preview.innerHTML += `<img src="${data.image}">`;
        }
      } else {
        document.getElementById('reviewModalTitle').textContent = 'إضافة تقييم جديد';
        document.getElementById('reviewForm').reset();
        document.getElementById('reviewId').value = '';
        document.getElementById('revImagePreview').innerHTML = '';
        reviewRating = 5;
        const stars = document.querySelectorAll('#starRating i');
        stars.forEach(s => s.style.color = parseInt(s.dataset.value) >= 5 ? '#f59e0b' : '#ddd');
        document.getElementById('revApproved').checked = true;
      }
    }

    function closeReviewModal() {
      document.getElementById('reviewModal').style.display = 'none';
    }

    function editReview(id) {
      db.collection('reviews').doc(id).get().then(doc => {
        if (doc.exists) openReviewModal({ id: doc.id, ...doc.data() });
      });
    }

    function toggleReview(id, approve) {
      db.collection('reviews').doc(id).update({ approved: approve });
    }

    function deleteReview(id) {
      if (confirm('هل أنت متأكد من حذف هذا التقييم؟')) {
        db.collection('reviews').doc(id).delete();
      }
    }

    async function saveReview(e) {
      e.preventDefault();
      const btn = document.getElementById('saveRevBtn');
      btn.disabled = true; btn.textContent = 'جاري الحفظ...';

      const id = document.getElementById('reviewId').value;
      const data = {
        name: document.getElementById('revName').value,
        email: document.getElementById('revEmail').value,
        rating: reviewRating,
        comment: document.getElementById('revComment').value,
        approved: document.getElementById('revApproved').checked,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      const files = document.getElementById('revImages').files;
      if (files.length > 0) {
        const urls = [];
        for (let i = 0; i < files.length; i++) {
          const url = await uploadImage(files[i]);
          if (url) urls.push(url);
        }
        if (urls.length > 0) {
          data.images = urls;
          data.image = urls[0];
        }
      }

      if (id) {
        await db.collection('reviews').doc(id).update(data);
      } else {
        data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
        await db.collection('reviews').add(data);
      }
      closeReviewModal();
      btn.disabled = false; btn.textContent = 'حفظ';
    }
  </script>
</body>
</html>
